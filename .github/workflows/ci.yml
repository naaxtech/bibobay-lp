# Continuous integration for the BIBO Bay site and Studio.
#
# Runs without any repository secret, so it behaves the same on a fork. Every action is pinned to a
# full commit SHA (the version is in the comment); see docs/deployment.md for how the SHAs were
# checked and how to update them.

name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, unit tests, build, bundle scan, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Install (from the lockfile)
        run: npm ci
      # Root typecheck and unit tests import the Studio schema, which needs `sanity` from studio/node_modules.
      - name: Install Studio (from its lockfile)
        run: npm --prefix studio ci
      - name: Environment contract
        run: npm run verify:env
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test:run
      - name: Production build (no secrets; the build's own production environment check must pass)
        run: npm run build
      - name: Client bundle secret scan
        run: npm run verify:bundle
      - name: Dependency audit, shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit, including dev tooling (reported, not blocking)
        continue-on-error: true
        shell: bash
        run: |
          npm audit --audit-level=high > audit-full.txt 2>&1 && status=0 || status=$?
          {
            echo "### npm audit --audit-level=high (dev tooling included, not blocking)"
            echo '```'
            tail -n 40 audit-full.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the full audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-full
          path: audit-full.txt
          if-no-files-found: ignore
          retention-days: 14

  studio:
    name: Sanity Studio typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Harmless placeholders: the build needs a project id and dataset, never a real one or a token.
      SANITY_STUDIO_PROJECT_ID: ci-placeholder
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install Studio (from its lockfile)
        run: npm --prefix studio ci
      - name: Studio typecheck
        run: npm --prefix studio run typecheck
      - name: Studio build
        run: npm --prefix studio run build
      - name: Studio dependency audit (reported, not blocking)
        continue-on-error: true
        shell: bash
        run: |
          npm --prefix studio audit --omit=dev --audit-level=high > studio-audit.txt 2>&1 && status=0 || status=$?
          {
            echo "### Studio npm audit --omit=dev --audit-level=high (not blocking)"
            echo '```'
            tail -n 40 studio-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the Studio audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-npm-audit
          path: studio-audit.txt
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright against the production build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PRODUCTION: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile; root only, as Vercel installs, so this proves the deploy builds without the Studio)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start the production server and wait for /api/health
        shell: bash
        run: |
          nohup npx next start -p 3000 -H 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "next start is healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "next start did not answer /api/health within 60s"
          cat next-start.log
          exit 1
      - name: Playwright (lead requests are always mocked; nothing reaches a real service)
        run: npx playwright test --reporter=github,html
      - name: Deployment verifier against the same server (fetch and browser)
        run: npm run verify:deployment -- http://127.0.0.1:3000 --browser --expect-heading "Bright minds. Kind hearts. Big adventures."
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14

  # Final review T-I6 (ruling R130): the commerce-on and the keyed (analytics and Sentry) browser runs
  # the ledger records, so they no longer depend on someone running them by hand. Both mirror the exact
  # local commands in docs/qa-checklist.md section 2, use no secret (placeholder values only; nothing
  # leaves the runner) and run after `verify`.
  e2e-commerce:
    name: Playwright, commerce switched on (scratch copy with the fixture)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PRODUCTION: "1"
      E2E_COMMERCE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The fixture script refuses the repository itself, a folder inside it and anything inside a git work tree,
      # so the copy is a sibling of the workspace and carries no .git folder and no node_modules.
      - name: Copy the checkout to a sibling folder and switch commerce on there
        shell: bash
        run: |
          mkdir ../commerce-copy
          tar --exclude=./.git --exclude=./node_modules --exclude=./.next -cf - . | tar -xf - -C ../commerce-copy
          node scripts/e2e/enable-commerce-fixture.mjs ../commerce-copy
      - name: Install (from the lockfile) in the copy
        working-directory: ../commerce-copy
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: ../commerce-copy
        run: npx playwright install --with-deps chromium
      - name: Production build of the copy
        working-directory: ../commerce-copy
        run: npm run build
      - name: Start the copy and wait for /api/health
        working-directory: ../commerce-copy
        shell: bash
        run: |
          nohup npx next start -p 3100 -H 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then
              echo "next start is healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "next start did not answer /api/health within 60s"
          cat next-start.log
          exit 1
      - name: Playwright, shop and commerce specs (orders are always mocked; nothing reaches a real service)
        working-directory: ../commerce-copy
        run: npx playwright test e2e/shop e2e/commerce --reporter=github,html
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-commerce
          path: |
            ../commerce-copy/playwright-report/
            ../commerce-copy/test-results/
            ../commerce-copy/next-start.log
          if-no-files-found: ignore
          retention-days: 14

  e2e-keyed:
    name: Playwright, analytics and Sentry keys present (placeholders)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PRODUCTION: "1"
      E2E_ANALYTICS: "1"
      E2E_SENTRY: "1"
      # Server-only and a placeholder: the build, `next start` and the freebie download spec all see it.
      LEAD_IP_HASH_SECRET: e2e-placeholder-hash-secret-0123456789abcdef
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile; root only)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # The NEXT_PUBLIC_ values are inlined at build time, so they belong to the build step. They are
      # placeholders on reserved example domains: the specs intercept every request to them. The
      # job-level LEAD_IP_HASH_SECRET placeholder is server-only; the freebie download spec mints a token with it.
      - name: Production build with placeholder analytics and Sentry settings
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_e2eplaceholder0000000000000000000000000
          NEXT_PUBLIC_POSTHOG_HOST: https://ph.example.com
          NEXT_PUBLIC_SENTRY_DSN: https://0123456789abcdef0123456789abcdef@o0.ingest.example.com/1
        run: npm run build
      - name: Start the production server (with a placeholder cron secret) and wait for /api/health
        env:
          CRON_SECRET: e2e-placeholder-cron-secret-0123456789abcdef
        shell: bash
        run: |
          nohup npx next start -p 3200 -H 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3200/api/health > /dev/null; then
              echo "next start is healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "next start did not answer /api/health within 60s"
          cat next-start.log
          exit 1
      - name: Playwright, analytics, observability and freebie download specs (every PostHog and Sentry request is intercepted)
        run: npx playwright test e2e/analytics e2e/observability e2e/freebies --reporter=github,html
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-keyed
          path: |
            playwright-report/
            test-results/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14

  # Ruling R213: the contact specs that need an open form are skipped on a keyless server, so they run
  # here against one started with the placeholder contact environment (docs/qa-checklist.md section 2c).
  # Every /api/contact call is answered by Playwright, and the placeholders reach nothing real.
  e2e-contact:
    name: Playwright, contact form open (placeholders)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PRODUCTION: "1"
      E2E_CONTACT_OPEN: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3300
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile; root only)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      # Every page renders per request, so the contact form's open condition (R205) is read when the
      # server starts, not at build time. Placeholders on reserved example domains; none is a secret.
      - name: Start the production server with the placeholder contact environment and wait for /api/health
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.com
          SUPABASE_SERVICE_ROLE_KEY: service-role-fixture-value
          LEAD_IP_HASH_SECRET: e2e-placeholder-hash-secret-0123456789abcdef
          RESEND_API_KEY: re_fixture
          RESEND_FROM: "BIBO Bay <hello@example.com>"
          STAFF_NOTIFICATION_EMAIL: staff@example.com
        shell: bash
        run: |
          nohup npx next start -p 3300 -H 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3300/api/health > /dev/null; then
              echo "next start is healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "next start did not answer /api/health within 60s"
          cat next-start.log
          exit 1
      - name: Playwright, contact specs against the open form (every /api/contact call is answered by Playwright)
        run: npx playwright test e2e/contact --reporter=github,html
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-contact
          path: |
            playwright-report/
            test-results/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14

  # Ruling R223: the bot check (Cloudflare Turnstile) runs here only, with Cloudflare's published always-pass
  # test keys. No other job sets either key, so the check stays off everywhere else. The site key is inlined
  # at build and the secret is read at start, so both are set on both steps. Cloudflare does not support
  # automated browsers on production challenges, which is why a test key pair is the only option here.
  # Every /api/contact and /api/leads call is answered by Playwright; the server-side spec calls Cloudflare's
  # real siteverify with the test secret, so this job needs network.
  e2e-bot-check:
    name: Playwright, bot check (Cloudflare test keys)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PRODUCTION: "1"
      E2E_BOT_CHECK: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3400
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile; root only)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Production build with the Turnstile test site key
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: npm run build
      - name: Start the production server with the placeholder contact environment and the Turnstile test keys, and wait for /api/health
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.com
          SUPABASE_SERVICE_ROLE_KEY: service-role-fixture-value
          LEAD_IP_HASH_SECRET: e2e-placeholder-hash-secret-0123456789abcdef
          RESEND_API_KEY: re_fixture
          RESEND_FROM: "BIBO Bay <hello@example.com>"
          STAFF_NOTIFICATION_EMAIL: staff@example.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        shell: bash
        run: |
          nohup npx next start -p 3400 -H 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3400/api/health > /dev/null; then
              echo "next start is healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "next start did not answer /api/health within 60s"
          cat next-start.log
          exit 1
      - name: Playwright, bot check specs (form requests are answered by Playwright)
        run: npx playwright test e2e/bot-check --reporter=github,html
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-bot-check
          path: |
            playwright-report/
            test-results/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14
